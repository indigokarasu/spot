<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Spot — reservation booking automation</title>
  <desc id="desc">One booking request turns into a confirmed reservation across SevenRooms, Resy, Tock, and OpenTable, then a Travel Context entry in Voyage. Four platform nodes feed one booking engine and a confirmed card.</desc>

  <defs>
    <radialGradient id="glow" cx="0.32" cy="0.42" r="0.75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15101F"/>
      <stop offset="0.55" stop-color="#0C0F16"/>
      <stop offset="1" stop-color="#0B0E11"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B26"/>
      <stop offset="1" stop-color="#10131B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#glow)"/>
  <!-- soft accent glow lower-left -->
  <circle cx="180" cy="300" r="120" fill="#7C5CFF" opacity="0.10"/>
  <circle cx="1020" cy="120" r="110" fill="#7C5CFF" opacity="0.06"/>

  <!-- LEFT: the ask -->
  <g transform="translate(64 70)">
    <rect x="0" y="0" width="380" height="280" rx="18" fill="#0E111A" stroke="#222838"/>
    <rect x="22" y="22" width="40" height="4" rx="2" fill="url(#accent)"/>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" letter-spacing="2" fill="#8A93A6">YOU ASK</text>
    <text x="22" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#F4F6FB">Book a table</text>
    <text x="22" y="138" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#C7CEDB">for 2 at Quince</text>
    <text x="22" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#C7CEDB">tonight, 7pm</text>
    <g transform="translate(22 200)">
      <rect width="336" height="56" rx="10" fill="#0B0E11" stroke="#1C2230"/>
      <circle cx="22" cy="28" r="6" fill="#7C5CFF"/>
      <text x="40" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#AEB6C6">&quot;table for 2 at Quince, 7pm&quot;</text>
    </g>
  </g>

  <!-- CENTER: hub + flow -->
  <g transform="translate(540 150)">
    <circle cx="60" cy="60" r="60" fill="#0E111A" stroke="url(#accent)" stroke-width="2"/>
        <path d="M60 18 C40 18 26 32 26 52 C26 74 54 92 60 96 C66 92 94 74 94 52 C94 32 80 18 60 18 Z" fill="url(#accent)"/>
    <circle cx="60" cy="52" r="13" fill="#0B0E11"/>
    <text x="60" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#C7CEDB">Spot engine</text>
    <!-- spokes to 4 platforms (top-left, top-right, bottom-left, bottom-right) -->
    <g stroke="#7C5CFF" stroke-width="2" opacity="0.55">
      <line x1="60" y1="60" x2="-130" y2="-40"/>
      <line x1="60" y1="60" x2="250" y2="-40"/>
      <line x1="60" y1="60" x2="-130" y2="160"/>
      <line x1="60" y1="60" x2="250" y2="160"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#AEB6C6" text-anchor="middle">
      <circle cx="-130" cy="-40" r="6" fill="#7C5CFF"/><text x="-130" y="-58">SevenRooms</text>
      <circle cx="250" cy="-40" r="6" fill="#7C5CFF"/><text x="250" y="-58">Resy</text>
      <circle cx="-130" cy="160" r="6" fill="#7C5CFF"/><text x="-130" y="182">Tock</text>
      <circle cx="250" cy="160" r="6" fill="#7C5CFF"/><text x="250" y="182">OpenTable</text>
    </g>
  </g>

  <!-- RIGHT: booked result -->
  <g transform="translate(820 70)">
    <rect x="0" y="0" width="316" height="280" rx="18" fill="url(#card)" stroke="#2A3350"/>
    <rect x="0" y="0" width="316" height="6" rx="3" fill="url(#accent)"/>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" letter-spacing="2" fill="#8A93A6">CONFIRMED</text>
    <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#F4F6FB">Quince · 7:00 PM</text>
    <text x="24" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#C7CEDB">Table for 2 · Tonight</text>
    <circle cx="34" cy="166" r="6" fill="#28C840"/>
    <text x="50" y="171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#9FE9B0">Booked via browser automation</text>
    <circle cx="34" cy="200" r="6" fill="#7C5CFF"/>
    <text x="50" y="205" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#C7CEDB">Travel Context → Voyage</text>
  </g>

  <!-- title lockup -->
  <text x="64" y="392" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#8A93A6">Reservation booking automation across SevenRooms · Resy · Tock · OpenTable — then into Voyage</text>
</svg>
